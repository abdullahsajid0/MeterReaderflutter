name: wattwise
description: A smart electricity meter tracking & consumption assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: ^1.2.0
  html: ^0.15.4
  camera: ^0.12.0+2
  google_mlkit_text_recognition: ^0.16.0
  fl_chart: ^1.2.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  lucide_icons: ^0.257.0
  intl: ^0.20.3
  uuid: ^4.3.3
  collection: ^1.18.0
  image_picker: ^1.2.3
  image: ^4.8.0
  flutter_local_notifications: ^18.0.1
  flutter_svg: ^2.0.10+1 # Added for your SVG logo rendering inside the app

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 # Added to automate generation of all native icon sizes
  flutter_native_splash: ^2.4.0

# Setup for the automated app launcher icon generator
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png" # You will save a 1024x1024 PNG here once
  adaptive_icon_background: "#FFFFFF" # Change to match your brand background color

# 2. Add this brand new configuration block at the bottom of the file
flutter_native_splash:
  color: "#FFFFFF" # Set this to your desired splash background color (e.g., White)
  image: "assets/images/splash_logo.png" # Path to your sharp, rectangular logo
  
  android: true
  ios: true
  
  # This stops the OS from aggressively stretching your rectangular logo
  android_gravity: center
  ios_content_mode: center

flutter:
  uses-material-design: true
  
  # Registered your asset folder so Flutter can see your SVG file
  assets:
    - assets/images/
 
