name: 🐛 Bug Report
description: Report a broken feature, crash, or calculation error
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I scan my meter / sync my bill, the app...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: disco
    attributes:
      label: Distribution Company (DISCO) Involved
      description: If this issue involves bill synchronization or tariff calculation, which company?
      options:
        - None / Not Applicable
        - LESCO (Lahore)
        - IESCO (Islamabad/Rawalpindi)
        - GEPCO (Gujranwala)
        - FESCO (Faisalabad)
        - MEPCO (Multan)
        - PESCO (Peshawar)
        - HESCO (Hyderabad)
        - SEPCO (Sukkur)
        - QESCO (Quetta)
        - TESCO (Tribal Areas)
        - Other

  - type: input
    id: device-info
    attributes:
      label: Device & OS
      description: e.g., Samsung Galaxy S21, Android 14 / Flutter 3.x
      placeholder: e.g., Xiaomi Redmi Note 12, Android 13
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace / Screenshots
      description: Paste any relevant terminal logs, stack traces, or upload screenshots here.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using the latest released version of WattWise.
          required: false
